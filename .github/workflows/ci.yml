name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          standalone: true
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        name: Install Node.js
        with:
          node-version: 24.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        # zinfer/vinfer resolve @zinfer-monorepo/core (a private, unpublished
        # workspace package bundled into their own dist at publish time)
        # through node_modules, which only works once core's own dist/
        # exists. `pnpm -r` builds in dependency order, so this also builds
        # core before zinfer/vinfer without needing to name it explicitly.
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Format
        run: pnpm -r format:check
      - name: Test
        run: pnpm -r test

  peer-floor:
    name: Peer floor (${{ matrix.package }} / ${{ matrix.name }})
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # strictTsc gates the "Typecheck (tsc)" step below. It's false only
          # for zinfer rows that actually move the typescript devDependency
          # down to its peer floor (the "typescript" and "combined" rows):
          # at typescript@5.0.2, tsc --noEmit (unlike tsgo) fails with
          # TS18048 in description-extractor.ts/extractor.ts, an error
          # absent at the pinned typescript devDependency version. zinfer's
          # "zod" row leaves typescript pinned, so it stays strict; vinfer's
          # floor is clean under both checkers at every row.
          - package: zinfer
            name: zod
            # typescript stays at the devDependencies-pinned version for this row.
            packages: zod@3.25.76
            strictTsc: true
          - package: zinfer
            name: typescript
            # 5.0.0 was never published on npm; 5.0.2 is the first release satisfying
            # peerDependencies.typescript's ">=5.0.0". zod stays at the pinned version here.
            packages: typescript@5.0.2
            strictTsc: false
          - package: zinfer
            name: combined
            # Both peerDependencies lower bounds installed together, since consumers can
            # be at both floors simultaneously.
            packages: zod@3.25.76 typescript@5.0.2
            strictTsc: false
          - package: vinfer
            name: valibot
            # typescript stays at the devDependencies-pinned version for this row.
            packages: valibot@1.1.0
            strictTsc: true
          - package: vinfer
            name: typescript
            # 5.0.0 was never published on npm; 5.0.2 is the first release satisfying
            # peerDependencies.typescript's ">=5.0.0". valibot stays at the pinned version here.
            packages: typescript@5.0.2
            strictTsc: true
          - package: vinfer
            name: combined
            # Both peerDependencies lower bounds installed together, since consumers can
            # be at both floors simultaneously.
            packages: valibot@1.1.0 typescript@5.0.2
            strictTsc: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          standalone: true
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        name: Install Node.js
        with:
          node-version: 24.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build core
        # ${{ matrix.package }} resolves @zinfer-monorepo/core through
        # node_modules; only its own typecheck/test steps below need it
        # built, not ${{ matrix.package }}'s own dist.
        run: pnpm --filter @zinfer-monorepo/core build
      - name: Install peerDependencies lower bound
        run: pnpm --filter ${{ matrix.package }} add -D ${{ matrix.packages }}
      - name: Typecheck (tsgo)
        run: pnpm --filter ${{ matrix.package }} run typecheck
      - name: Typecheck (tsc)
        if: matrix.strictTsc
        run: pnpm --filter ${{ matrix.package }} run typecheck:tsc
      - name: Test
        run: pnpm --filter ${{ matrix.package }} run test
